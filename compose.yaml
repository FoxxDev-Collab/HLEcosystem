# compose.yaml
# HLEcosystem legacy stack — PostgreSQL 16 (foxxlab) + the two apps that were
# NOT absorbed into the consolidated hle-all-in-one (which has its own
# compose.yaml on a dedicated PG18):
#
#   - hle-claude-api  — internal AI gateway. hle-all-in-one's receipt OCR /
#     smart categorize / advisor features call it via CLAUDE_API_URL +
#     CLAUDE_API_SERVICE_SECRET (server-to-server, no user session).
#   - hle-file-server — file storage, not yet ported. NOTE: its login flowed
#     through Family Manager (the old SSO provider), which was consolidated
#     away — the service is kept as the source for the future files module
#     but cannot authenticate users standalone.
#
# The nine consolidated apps (family_manager, familyhub, family_finance,
# family_health, family_home_care, meal_prep, family_travel, family_wiki,
# media) were removed from the repo; their foxxlab schemas remain in the
# database untouched.

x-nextjs-app: &nextjs-app
  restart: unless-stopped
  networks:
    - hle-net
  depends_on:
    postgres:
      condition: service_healthy
  environment: &nextjs-env
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    HOSTNAME: "0.0.0.0"
    PORT: "3000"
    AUTH_URL: ${AUTH_URL:-http://localhost:8080}
    AUTH_DOMAIN: ${AUTH_DOMAIN:-}
    SECURE_COOKIES: ${SECURE_COOKIES:-}
  healthcheck:
    test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  logging:
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "10"
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 128M

services:

  # PostgreSQL 16
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: foxxlab-postgres
    restart: unless-stopped
    networks:
      - hle-net
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: foxxlab
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d foxxlab"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # File Server — kept as the future files-module source; see header note.
  hle-file-server:
    <<: *nextjs-app
    container_name: foxxlab-file-server
    build:
      context: .
      dockerfile: Containerfile.nextjs
      args:
        APP_DIR: hle-file_server
        NEXT_PUBLIC_APP_NAME: "HLE File Server"
    ports:
      - "8085:3000"
    volumes:
      - file-server-uploads:/app/uploads
    environment:
      <<: *nextjs-env
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/foxxlab?schema=file_server"
      APP_URL: ${FILES_URL:-http://localhost:8085}
      UPLOAD_DIR: "/app/uploads"
      MAX_FILE_SIZE_MB: "500"
      CLAUDE_API_URL: "http://hle-claude-api:3000"
      CLAUDE_API_SERVICE_SECRET: ${CLAUDE_API_SERVICE_SECRET}

  # Claude API — internal AI gateway (service-secret auth, no user session).
  hle-claude-api:
    <<: *nextjs-app
    container_name: foxxlab-claude-api
    build:
      context: .
      dockerfile: Containerfile.nextjs
      args:
        APP_DIR: hle-claude_api
        NEXT_PUBLIC_APP_NAME: "HLE Claude API"
    ports:
      - "${CLAUDE_API_PORT:-8088}:3000"
    environment:
      <<: *nextjs-env
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/foxxlab?schema=claude_api"
      APP_URL: ${CLAUDE_API_URL:-http://localhost:8088}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_API_SERVICE_SECRET: ${CLAUDE_API_SERVICE_SECRET}

networks:
  hle-net:
    driver: bridge
    name: hle-net

volumes:
  postgres-data:
    name: hle-postgres-data
  file-server-uploads:
    name: hle-file-server-uploads
